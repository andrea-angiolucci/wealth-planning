<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wealth">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Wealth Planning</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --line: #334155; --text: #f1f5f9; --muted: #94a3b8;
    --accent: #38bdf8; --out: #fb7185; --in: #4ade80;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); min-height: 100vh; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  .muted { color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  input, select, button { font: inherit; color: var(--text); }
  input, select { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 16px; }
  input[type=checkbox] { width: auto; }
  input:focus, select:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button { border: 0; border-radius: 10px; padding: 12px 16px; background: var(--accent); color: #082f49; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 500; }
  button.small { padding: 6px 10px; font-size: 13px; }
  button.danger { background: transparent; color: var(--out); border: 1px solid var(--out); font-weight: 500; }
  button:disabled { opacity: .5; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
  .head .row { flex: none; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tabs button { flex: 1; background: var(--card); color: var(--muted); border: 1px solid var(--line); padding: 10px 6px; font-size: 14px; }
  .tabs button.on { background: var(--accent); color: #082f49; border-color: var(--accent); }
  .toggle { display: flex; gap: 6px; margin-bottom: 10px; }
  .toggle button { flex: 1; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
  .toggle button.on.out { background: var(--out); color: #4c0519; border-color: var(--out); }
  .toggle button.on.in { background: var(--in); color: #052e16; border-color: var(--in); }
  .amount { font-size: 32px; font-weight: 700; text-align: center; margin-bottom: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; font-weight: 500; font-size: 14px; }
  .chip.on { background: var(--accent); color: #082f49; border-color: var(--accent); }
  .field { margin-bottom: 10px; }
  .field > label, .lbl { display: block; color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  .check { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; margin: 6px 0 10px; }
  .sums { display: flex; gap: 10px; }
  .sums > div { flex: 1; text-align: center; }
  .sums .v { font-size: 20px; font-weight: 700; }
  .out { color: var(--out); } .in { color: var(--in); }
  .tx { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); gap: 8px; }
  .tx:first-child { border-top: 0; }
  .tx .l { flex: 1; min-width: 0; }
  .tx .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx .a { font-weight: 600; white-space: nowrap; }
  .tx .x { background: transparent; color: var(--muted); padding: 6px 10px; font-size: 18px; }
  .tx a { color: var(--accent); }
  .msg { padding: 10px 12px; border-radius: 10px; font-size: 14px; margin-bottom: 10px; }
  .msg.err { background: #4c0519; color: #fecdd3; }
  .msg.ok { background: #052e16; color: #bbf7d0; }
  .hidden { display: none !important; }
  .center { text-align: center; }
  .big { font-size: 28px; font-weight: 700; }
  .acc { border-top: 1px solid var(--line); padding: 12px 0; }
  .acc:first-of-type { border-top: 0; }
  .acc .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .acc .actions { display: flex; gap: 6px; margin-top: 8px; }
  .panel { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 10px; }
  .thumb { width: 64px; height: 40px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); flex: none; }
  .thumb.big { width: 100%; height: auto; max-height: 180px; margin-top: 8px; }
  .banner { background: #422006; color: #fde68a; border-radius: 10px; padding: 8px 12px; font-size: 14px; margin-bottom: 12px; }
  input[type=date] { display: block; width: 100%; min-width: 0; max-width: 100%; min-height: 48px; -webkit-appearance: none; appearance: none; text-align: left; }
  input[type=date]::-webkit-date-and-time-value { text-align: left; min-width: 0; margin: 0; }
  input[type=date]::-webkit-calendar-picker-indicator { margin-left: auto; }
  .card.fold { padding: 0; overflow: hidden; }
  .fold-head { display: flex; justify-content: space-between; align-items: center; width: 100%; background: transparent; color: var(--text); border-radius: 0; padding: 14px; font-size: 16px; font-weight: 600; text-align: left; }
  .fold-head .chev { color: var(--muted); font-size: 14px; }
  .fold-body { padding: 0 14px 14px; }
  .geo { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .geo .muted { flex: 1; }
  .geo button { flex: none; }
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <section id="login" class="hidden">
    <div class="head"><h1>Wealth Planning</h1></div>
    <div class="card">
      <div id="loginMsg"></div>
      <form id="loginForm">
        <div class="field"><input id="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="email"></div>
        <div class="field"><input id="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="password"></div>
        <label class="check"><input id="showPw" type="checkbox"> Mostra password</label>
        <button id="signIn" type="submit" style="width:100%">Entra</button>
      </form>
    </div>
  </section>

  <!-- APP -->
  <section id="app" class="hidden">
    <div class="head">
      <h1>Wealth</h1>
      <div id="patrimonioTop" class="muted" style="flex:1;text-align:right"></div>
      <button id="userBtn" class="ghost small" aria-label="Menu utente" style="flex:none;padding:6px 8px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></button>
    </div>
    <div id="offline" class="banner hidden"></div>
    <div class="tabs">
      <button id="tabMoves" class="on">Movimenti</button>
      <button id="tabAccounts">Conti</button>
    </div>

    <!-- MOVIMENTI -->
    <div id="viewMoves">
      <div class="head">
        <div class="row">
          <button id="prevM" class="ghost small">‹</button>
          <h2 id="monthLabel" style="min-width:150px;text-align:center;margin:0"></h2>
          <button id="nextM" class="ghost small">›</button>
        </div>
      </div>

      <div class="card sums">
        <div><div class="muted">Uscite</div><div id="sumOut" class="v out">–</div></div>
        <div><div class="muted">Entrate</div><div id="sumIn" class="v in">–</div></div>
        <div><div class="muted">Saldo mese</div><div id="sumNet" class="v">–</div></div>
      </div>

      <div class="card">
        <div id="addMsg"></div>
        <div class="toggle">
          <button id="kOut" class="on out">Uscita</button>
          <button id="kIn" class="in">Entrata</button>
        </div>
        <div id="amountBox"></div>
        <div id="chips" class="chips"></div>
        <div class="field"><input id="merchant" type="text" placeholder="Dove / descrizione (facoltativo)" autocomplete="off"></div>
        <div class="geo">
          <button id="geoBtn" type="button" class="ghost small">Registra posizione</button>
          <span id="geoInfo" class="muted"></span>
        </div>
        <div class="row field">
          <select id="account"></select>
          <input id="date" type="date">
        </div>
        <div id="accImg"></div>
        <button id="save" style="width:100%">Salva</button>
      </div>

      <div class="card">
        <div id="list"></div>
        <p id="empty" class="muted center hidden" style="margin:6px 0">Nessun movimento in questo mese.</p>
      </div>
    </div>

    <!-- CONTI -->
    <div id="viewAccounts" class="hidden"></div>

    <!-- CATEGORIE -->
    <div id="viewSettings" class="hidden"></div>
  </section>

</div>

<script type="module">
import { createClient } from "./supabase.js";
const APP_VERSION = "7";

const SUPABASE_URL = "https://rdlyhcwjvatrcmtjoucv.supabase.co";
const SUPABASE_KEY = "sb_publishable_lYFIA17BKVXTJXk4Nc0kNA_T9AjAdGI"; // chiave pubblica: la protezione e' la RLS

const sb = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
const $ = (id) => document.getElementById(id);
const eur = new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" });
const fmtEur = (cents) => eur.format(Number(cents) / 100);
const TYPE_LABEL = { cash: "Contanti", bank: "Conto", card: "Carta di credito", prepaid: "Carta prepagata / debito", investment: "Investimenti", other: "Altro" };
const state = {
  open: {}, newAcc: false, tab: "moves", kind: "expense", categoryId: null, accounts: [], categories: [], recs: {},
  month: firstOfMonth(new Date()), panel: null, geo: null,
};

function firstOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function iso(d) { const z = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; }
function show(node, on) { node.classList.toggle("hidden", !on); }
function itDate(s) { return new Date(s + "T00:00:00").toLocaleDateString("it-IT", { day: "numeric", month: "short" }); }

// Crea elementi DOM senza mai usare innerHTML (i testi restano testo)
function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k === "value" || k === "checked" || k === "disabled" || k === "selected") n[k] = v;
    else if (k.startsWith("on")) n[k] = v;
    else n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
}
function msg(boxId, text, type = "err") {
  const box = typeof boxId === "string" ? $(boxId) : boxId; box.textContent = "";
  if (!text) return;
  box.appendChild(el("div", { class: "msg " + type, text }));
}

/* ---------- IMPORTO A DECIMALI FISSI (stile bancomat) ---------- */
// Scrivi solo le cifre: 1 2 5 0 diventa 12,50. Il backspace toglie l'ultima cifra.
function fmtPlain(cents) { return Math.floor(cents / 100).toLocaleString("it-IT") + "," + String(cents % 100).padStart(2, "0"); }
function moneyInput({ big = false, withSign = false, signLabel = "Saldo negativo (debito)" } = {}) {
  let cents = 0;
  const input = el("input", { type: "text", inputmode: "numeric", autocomplete: "off", class: big ? "amount" : "" });
  const render = () => { input.value = fmtPlain(cents); };
  input.addEventListener("input", () => {
    const d = input.value.replace(/\D/g, "").replace(/^0+/, "").slice(0, 11);
    cents = d ? parseInt(d, 10) : 0; render();
  });
  input.addEventListener("focus", () => setTimeout(() => { try { input.setSelectionRange(input.value.length, input.value.length); } catch (e) {} }, 0));
  render();
  const neg = withSign ? el("input", { type: "checkbox" }) : null;
  const wrap = el("div", {}, input, neg ? el("label", { class: "check" }, neg, signLabel) : null);
  return {
    wrap, input,
    abs: () => cents,
    signed: () => (neg && neg.checked ? -cents : cents),
    set(c) { cents = Math.abs(c); if (neg) neg.checked = c < 0; render(); },
    reset() { cents = 0; if (neg) neg.checked = false; render(); },
  };
}

/* ---------- OFFLINE: cache locale e coda di invio ---------- */
const OUT_KEY = "wp_outbox";
const readJSON = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
const writeJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const outbox = () => readJSON(OUT_KEY, []);
const isNetErr = (e) => !navigator.onLine || /fetch|network|load failed|timeout/i.test((e && e.message) || "");
function updateBanner() {
  const n = outbox().length, off = !navigator.onLine || state.cached;
  const parts = [];
  if (off) parts.push("Sei offline: vedi i dati dell'ultimo aggiornamento.");
  if (n) parts.push(n + (n === 1 ? " movimento in attesa" : " movimenti in attesa") + " di invio.");
  $("offline").textContent = parts.join(" ");
  show($("offline"), parts.length > 0);
}
async function flushOutbox() {
  const q = outbox(); if (!q.length || !navigator.onLine) return updateBanner();
  const rest = [];
  for (let i = 0; i < q.length; i++) {
    const { error } = await sb.from("transactions").insert(q[i]);
    if (error && error.code !== "23505") { rest.push(...q.slice(i)); break; }
  }
  writeJSON(OUT_KEY, rest); updateBanner();
}
window.addEventListener("online", async () => { await flushOutbox(); if (!$("app").classList.contains("hidden")) await refreshAll(); });
window.addEventListener("offline", updateBanner);

/* ---------- IMMAGINE (carte) ---------- */
function imagePicker(current) {
  let value; // undefined = invariata, null = rimossa, stringa = nuova
  const holder = el("div");
  const file = el("input", { type: "file", accept: "image/*" });
  const draw = () => {
    holder.textContent = "";
    const src = value === undefined ? current : value;
    if (src) holder.append(el("img", { class: "thumb big", src, alt: "" }), el("button", { type: "button", class: "ghost small", style: "margin-top:8px", text: "Rimuovi immagine", onclick: () => { value = null; draw(); } }));
  };
  file.onchange = async () => {
    const f = file.files[0]; if (!f) return;
    try {
      const bmp = await createImageBitmap(f);
      const k = Math.min(1, 640 / bmp.width);
      const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      value = c.toDataURL("image/jpeg", 0.82); draw();
    } catch (e) { alert("Immagine non leggibile."); }
  };
  draw();
  return { wrap: el("div", {}, file, holder), value: () => value };
}

/* ---------- LOGIN ---------- */
$("email").value = localStorage.getItem("wp_email") || "";
$("showPw").onchange = (e) => { $("password").type = e.target.checked ? "text" : "password"; };
$("loginForm").onsubmit = async (ev) => {
  ev.preventDefault();
  const email = $("email").value.trim().toLowerCase();
  const password = $("password").value;
  if (!email || !password) return msg("loginMsg", "Inserisci email e password.");
  $("signIn").disabled = true; msg("loginMsg", "");
  const { error } = await sb.auth.signInWithPassword({ email, password });
  $("signIn").disabled = false;
  if (error) return msg("loginMsg", "Accesso non riuscito: " + error.message);
  localStorage.setItem("wp_email", email); $("password").value = "";
  await boot();
};
async function doLogout() { await sb.auth.signOut(); localStorage.removeItem("wp_cache"); await boot(); }

/* ---------- DATI DI BASE ---------- */
async function loadRefs() {
  const [a, b, c, r] = await Promise.all([
    sb.from("accounts").select("id,name,type,opening_balance_cents,opening_date,image_data").eq("archived", false).order("created_at"),
    sb.from("account_balances").select("account_id,balance_cents"),
    sb.from("categories").select("id,name,kind,sort_order").eq("archived", false).order("sort_order").order("name"),
    sb.from("reconciliations").select("account_id,as_of,diff_cents").order("as_of", { ascending: false }).limit(300),
  ]);
  const err = a.error || b.error || c.error || r.error;
  if (err) {
    const c = readJSON("wp_cache", null);
    if (c) { state.accounts = c.accounts; state.categories = c.categories; state.recs = c.recs; state.cached = true; updateBanner(); return true; }
    msg("addMsg", "Errore nel caricamento: " + err.message); return false;
  }
  state.cached = false;
  const bal = Object.fromEntries(b.data.map((x) => [x.account_id, Number(x.balance_cents)]));
  state.accounts = a.data.map((x) => ({ ...x, opening_balance_cents: Number(x.opening_balance_cents), balance: bal[x.id] ?? Number(x.opening_balance_cents) }));
  state.categories = c.data;
  state.recs = {};
  for (const x of r.data) if (!state.recs[x.account_id]) state.recs[x.account_id] = x;
  writeJSON("wp_cache", { accounts: state.accounts, categories: state.categories, recs: state.recs });
  updateBanner();
  return true;
}
async function refreshAll() {
  if (!(await loadRefs())) return;
  renderSelects(); renderChips(); renderPatrimonioTop();
  if (state.tab === "moves") await loadMonth();
  else if (state.tab === "accounts") renderAccounts();
  else renderSettings();
}
function renderPatrimonioTop() {
  const total = state.accounts.reduce((s, a) => s + a.balance, 0);
  $("patrimonioTop").textContent = "Patrimonio " + fmtEur(total);
}
function fillAccountSelect(sel, selectedId) {
  sel.textContent = "";
  for (const a of state.accounts) sel.appendChild(el("option", { value: a.id, text: a.name, selected: a.id === selectedId }));
}
function renderAccImg() {
  const box = $("accImg"); box.textContent = "";
  const a = state.accounts.find((x) => x.id === $("account").value);
  if (a && a.image_data) box.appendChild(el("img", { class: "thumb", src: a.image_data, alt: "", style: "margin-bottom:10px" }));
}
function renderSelects() {
  const keep = $("account").value || localStorage.getItem("wp_lastAccount");
  fillAccountSelect($("account"), keep);
  renderAccImg();
}
$("account").onchange = renderAccImg;
function renderChips() {
  const box = $("chips"); box.textContent = "";
  for (const c of state.categories.filter((x) => x.kind === state.kind)) {
    box.appendChild(el("button", {
      type: "button", class: "chip" + (c.id === state.categoryId ? " on" : ""), text: c.name,
      onclick: () => { state.categoryId = state.categoryId === c.id ? null : c.id; renderChips(); },
    }));
  }
}

/* ---------- SCHEDE ---------- */
function setTab(t) {
  state.tab = t; state.panel = null;
  show($("viewMoves"), t === "moves"); show($("viewAccounts"), t === "accounts"); show($("viewSettings"), t === "settings");
  $("tabMoves").classList.toggle("on", t === "moves");
  $("tabAccounts").classList.toggle("on", t === "accounts");
  $("userBtn").style.color = t === "settings" ? "var(--accent)" : "";
  if (t === "moves") loadMonth(); else if (t === "accounts") renderAccounts(); else renderSettings();
}
$("tabMoves").onclick = () => setTab("moves");
$("tabAccounts").onclick = () => setTab("accounts");
$("userBtn").onclick = () => setTab(state.tab === "settings" ? "moves" : "settings");

/* ---------- MOVIMENTI ---------- */
const amountField = moneyInput({ big: true });
$("amountBox").appendChild(amountField.wrap);

async function loadMonth() {
  const from = iso(state.month);
  const to = iso(new Date(state.month.getFullYear(), state.month.getMonth() + 1, 1));
  $("monthLabel").textContent = state.month.toLocaleDateString("it-IT", { month: "long", year: "numeric" });
  const res = await sb.from("transactions")
    .select("id,occurred_on,amount_cents,merchant,category_id,account_id,kind,transfer_id,lat,lon")
    .gte("occurred_on", from).lt("occurred_on", to)
    .order("occurred_on", { ascending: false }).order("created_at", { ascending: false }).limit(500);
  let data = res.data;
  const ck = "wp_tx_" + from;
  if (res.error) { data = readJSON(ck, null); if (!data) return msg("addMsg", "Errore nel caricamento movimenti: " + res.error.message); }
  else writeJSON(ck, data);
  const pend = outbox().filter((r) => r.occurred_on >= from && r.occurred_on < to).map((r) => ({ ...r, pending: true }));
  data = [...pend, ...data];
  const catName = Object.fromEntries(state.categories.map((c) => [c.id, c.name]));
  const accName = Object.fromEntries(state.accounts.map((a) => [a.id, a.name]));
  let out = 0, inn = 0;
  const list = $("list"); list.textContent = "";
  for (const t of data) {
    const v = Number(t.amount_cents);
    if (t.kind === "normal") { if (v < 0) out += -v; else inn += v; }
    const title0 = t.kind === "transfer" ? "Giroconto" : t.kind === "adjustment" ? "Rettifica quadratura" : (t.merchant || catName[t.category_id] || "Senza descrizione");
    const title = t.pending ? title0 + " (in attesa)" : title0;
    const sub = itDate(t.occurred_on) + " · " + (accName[t.account_id] || "?") + (t.category_id && t.kind === "normal" ? " · " + catName[t.category_id] : "");
    const subNode = el("div", { class: "muted" }, sub);
    if (t.lat != null && t.lon != null) {
      subNode.append(" · ", el("a", { href: `https://maps.apple.com/?ll=${t.lat},${t.lon}&q=${encodeURIComponent(title)}`, target: "_blank", rel: "noopener", text: "mappa" }));
    }
    list.appendChild(el("div", { class: "tx" },
      el("div", { class: "l" }, el("div", { class: "t", text: title }), subNode),
      el("div", { class: "a " + (t.kind !== "normal" ? "" : v < 0 ? "out" : "in"), text: fmtEur(v) }),
      el("button", { class: "x", "aria-label": "Elimina", text: "×", onclick: () => t.pending ? (writeJSON(OUT_KEY, outbox().filter((r) => r.id !== t.id)), updateBanner(), loadMonth()) : deleteTx(t) }),
    ));
  }
  show($("empty"), data.length === 0);
  $("sumOut").textContent = fmtEur(out); $("sumIn").textContent = fmtEur(inn);
  const net = inn - out; $("sumNet").textContent = fmtEur(net); $("sumNet").className = "v " + (net < 0 ? "out" : "in");
}
async function deleteTx(t) {
  if (!confirm(t.kind === "transfer" ? "Eliminare il giroconto (entrambe le parti)?" : "Eliminare questo movimento?")) return;
  const q = sb.from("transactions").delete();
  const r = await (t.transfer_id ? q.eq("transfer_id", t.transfer_id) : q.eq("id", t.id));
  if (r.error) return msg("addMsg", "Eliminazione non riuscita: " + r.error.message);
  await refreshAll();
}
function setKind(k) {
  state.kind = k; state.categoryId = null;
  $("kOut").className = (k === "expense" ? "on " : "") + "out"; $("kIn").className = (k === "income" ? "on " : "") + "in";
  renderChips();
}
$("kOut").onclick = () => setKind("expense");
$("kIn").onclick = () => setKind("income");

/* posizione */
function renderGeo() {
  const g = state.geo;
  $("geoInfo").textContent = g ? `Posizione registrata (±${Math.round(g.acc)} m)` : "";
  $("geoBtn").textContent = g ? "Rimuovi posizione" : "Registra posizione";
}
$("geoBtn").onclick = () => {
  if (state.geo) { state.geo = null; return renderGeo(); }
  if (!navigator.geolocation) return msg("addMsg", "Posizione non disponibile su questo dispositivo.");
  $("geoBtn").disabled = true; $("geoInfo").textContent = "Cerco la posizione...";
  navigator.geolocation.getCurrentPosition(
    (p) => { state.geo = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy }; $("geoBtn").disabled = false; renderGeo(); },
    (e) => { $("geoBtn").disabled = false; $("geoInfo").textContent = ""; msg("addMsg", "Posizione non ottenuta: " + (e.code === 1 ? "permesso negato (Impostazioni iPhone, Privacy, Localizzazione)." : e.message)); },
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 },
  );
};

$("save").onclick = async () => {
  msg("addMsg", "");
  const cents = amountField.abs();
  if (!cents) return msg("addMsg", "Inserisci l'importo.");
  if (!$("account").value) return msg("addMsg", "Manca il conto: aggiungilo nella scheda Conti.");
  $("save").disabled = true;
  const row = {
    id: crypto.randomUUID(), account_id: $("account").value, category_id: state.categoryId,
    occurred_on: $("date").value || iso(new Date()),
    amount_cents: state.kind === "expense" ? -cents : cents,
    merchant: $("merchant").value.trim() || null, source: "manual", kind: "normal",
    lat: state.geo ? state.geo.lat : null, lon: state.geo ? state.geo.lon : null, accuracy_m: state.geo ? state.geo.acc : null,
  };
  const { error } = await sb.from("transactions").insert(row);
  $("save").disabled = false;
  let queued = false;
  if (error) {
    if (!isNetErr(error)) return msg("addMsg", "Salvataggio non riuscito: " + error.message);
    writeJSON(OUT_KEY, [...outbox(), row]); queued = true; updateBanner();
  }
  localStorage.setItem("wp_lastAccount", row.account_id);
  amountField.reset(); $("merchant").value = ""; state.categoryId = null; state.geo = null; renderGeo(); renderChips();
  msg("addMsg", queued ? "Salvato sul telefono: verrà inviato appena c'è rete." : "Salvato.", "ok"); setTimeout(() => msg("addMsg", ""), 2500);
  await refreshAll(); amountField.input.focus();
};
$("prevM").onclick = () => { state.month = new Date(state.month.getFullYear(), state.month.getMonth() - 1, 1); loadMonth(); };
$("nextM").onclick = () => { state.month = new Date(state.month.getFullYear(), state.month.getMonth() + 1, 1); loadMonth(); };

/* ---------- CONTI, PATRIMONIO, GIROCONTI, QUADRATURA ---------- */
function typeSelect(value) {
  const s = el("select");
  for (const [k, v] of Object.entries(TYPE_LABEL)) s.appendChild(el("option", { value: k, text: v, selected: k === value }));
  return s;
}
function collapsible(key, title, ...body) {
  state.open = state.open || {};
  const chev = el("span", { class: "chev", text: state.open[key] ? "▾" : "▸" });
  const content = el("div", { class: "fold-body" + (state.open[key] ? "" : " hidden") }, ...body);
  const head = el("button", { type: "button", class: "fold-head", onclick: () => {
    state.open[key] = !state.open[key];
    content.classList.toggle("hidden", !state.open[key]); chev.textContent = state.open[key] ? "▾" : "▸";
  } }, el("span", { text: title }), chev);
  return el("div", { class: "card fold" }, head, content);
}
function field(label, node) { return el("div", { class: "field" }, el("label", { text: label }), node); }

function renderAccounts() {
  const root = $("viewAccounts"); root.textContent = "";
  const total = state.accounts.reduce((s, a) => s + a.balance, 0);
  root.appendChild(el("div", { class: "card center" },
    el("div", { class: "muted", text: "Patrimonio" }),
    el("div", { class: "big " + (total < 0 ? "out" : ""), text: fmtEur(total) }),
  ));

  const card = el("div", { class: "card" }, el("h2", { text: "I tuoi conti" }));
  if (!state.accounts.length) card.appendChild(el("p", { class: "muted", text: "Nessun conto. Aggiungine uno qui sotto." }));
  for (const a of state.accounts) {
    const rec = state.recs[a.id];
    const recTxt = rec ? `Ultima quadratura ${itDate(rec.as_of)}: ` + (Number(rec.diff_cents) === 0 ? "ok" : "differenza " + fmtEur(rec.diff_cents)) : "Mai quadrato con l'estratto conto";
    const open = state.panel && state.panel.id === a.id ? state.panel.kind : null;
    card.appendChild(el("div", { class: "acc" },
      el("div", { class: "top" }, el("div", { class: "row", style: "justify-content:flex-start;flex:1" }, a.image_data ? el("img", { class: "thumb", src: a.image_data, alt: "" }) : null, el("div", { style: "flex:1" }, el("strong", { text: a.name }), el("span", { class: "muted", text: " · " + TYPE_LABEL[a.type] }))),
        el("strong", { class: a.balance < 0 ? "out" : "", text: fmtEur(a.balance) })),
      el("div", { class: "muted", text: `Saldo iniziale ${fmtEur(a.opening_balance_cents)} al ${itDate(a.opening_date)}. ${recTxt}.` }),
      el("div", { class: "actions" },
        el("button", { class: "ghost small", text: "Modifica", onclick: () => { state.panel = open === "edit" ? null : { id: a.id, kind: "edit" }; renderAccounts(); } }),
        el("button", { class: "ghost small", text: "Quadra con estratto", onclick: () => { state.panel = open === "rec" ? null : { id: a.id, kind: "rec" }; renderAccounts(); } }),
      ),
      open === "edit" ? editPanel(a) : null,
      open === "rec" ? recPanel(a) : null,
    ));
  }
  root.appendChild(card);
  root.appendChild(transferCard());
}

function editPanel(a) {
  const name = el("input", { type: "text", value: a.name });
  const type = typeSelect(a.type);
  const bal = moneyInput({ withSign: true }); bal.set(a.opening_balance_cents);
  const date = el("input", { type: "date", value: a.opening_date });
  const pic = imagePicker(a.image_data);
  const box = el("div");
  return el("div", { class: "panel" },
    box, field("Nome", name), field("Tipo", type), field("Immagine della carta (facoltativa)", pic.wrap),
    field("Saldo iniziale", bal.wrap), field("Data del saldo iniziale", date),
    el("p", { class: "muted", text: "Contano solo i movimenti con data uguale o successiva a quella del saldo iniziale." }),
    el("div", { class: "row" },
      el("button", { text: "Salva", onclick: async () => {
        if (!name.value.trim()) return msg(box, "Il nome non può essere vuoto.");
        const { error } = await sb.from("accounts").update({ name: name.value.trim(), type: type.value, opening_balance_cents: bal.signed(), opening_date: date.value, ...(pic.value() !== undefined ? { image_data: pic.value() } : {}) }).eq("id", a.id);
        if (error) return msg(box, "Non salvato: " + error.message);
        state.panel = null; await refreshAll();
      } }),
      el("button", { class: "danger", text: "Archivia", onclick: async () => {
        if (!confirm("Archiviare il conto? Non comparirà più nel patrimonio né nelle liste (i movimenti restano).")) return;
        const { error } = await sb.from("accounts").update({ archived: true }).eq("id", a.id);
        if (error) return msg(box, "Non archiviato: " + error.message);
        state.panel = null; await refreshAll();
      } }),
    ),
  );
}

function recPanel(a) {
  const date = el("input", { type: "date", value: iso(new Date()) });
  const stmt = moneyInput({ withSign: true, signLabel: "Saldo negativo" });
  const out = el("div");
  return el("div", { class: "panel" },
    el("p", { class: "muted", text: "Inserisci il saldo finale che risulta sull'estratto conto alla data indicata." }),
    field("Data dell'estratto", date), field("Saldo dell'estratto", stmt.wrap), out,
    el("button", { style: "width:100%", text: "Controlla", onclick: async () => {
      msg(out, "");
      const { data: bal, error } = await sb.rpc("balance_at", { p_account: a.id, p_date: date.value });
      if (error) return msg(out, "Controllo non riuscito: " + error.message);
      const appBal = Number(bal), st = stmt.signed(), diff = st - appBal;
      const up = await sb.from("reconciliations").upsert({ account_id: a.id, as_of: date.value, statement_balance_cents: st, diff_cents: diff }, { onConflict: "account_id,as_of" });
      if (up.error) return msg(out, "Quadratura non salvata: " + up.error.message);
      out.textContent = "";
      out.appendChild(el("div", { class: "msg " + (diff === 0 ? "ok" : "err") },
        `Saldo nell'app ${fmtEur(appBal)}, estratto ${fmtEur(st)}. ` + (diff === 0 ? "Quadra." : `Differenza ${fmtEur(diff)}.`)));
      if (diff !== 0) {
        out.appendChild(el("p", { class: "muted", text: "Controlla se manca qualche movimento. Se non lo trovi, puoi registrare una rettifica che porta il saldo dell'app a quello dell'estratto." }));
        out.appendChild(el("button", { class: "ghost", style: "width:100%", text: `Crea rettifica di ${fmtEur(diff)}`, onclick: async () => {
          const r = await sb.from("transactions").insert({ account_id: a.id, occurred_on: date.value, amount_cents: diff, merchant: "Rettifica quadratura", kind: "adjustment", source: "manual" });
          if (r.error) return msg(out, "Rettifica non riuscita: " + r.error.message);
          await sb.from("reconciliations").update({ diff_cents: 0 }).eq("account_id", a.id).eq("as_of", date.value);
          state.panel = null; await refreshAll();
        } }));
      } else { await refreshAll(); }
    } }),
  );
}

function transferCard() {
  const from = el("select"), to = el("select");
  fillAccountSelect(from, state.accounts[0] && state.accounts[0].id);
  fillAccountSelect(to, state.accounts[1] && state.accounts[1].id);
  const amt = moneyInput({ big: true });
  const date = el("input", { type: "date", value: iso(new Date()) });
  const box = el("div");
  return collapsible("transfer", "Giroconto tra conti",
    el("p", { class: "muted", text: "Per spostare soldi tra i tuoi conti (prelievo, pagamento della carta, ricarica). Non conta come spesa né come entrata." }),
    box, field("Da", from), field("A", to), amt.wrap, field("Data", date),
    el("button", { style: "width:100%", text: "Registra giroconto", onclick: async () => {
      if (state.accounts.length < 2) return msg(box, "Servono almeno due conti.");
      if (from.value === to.value) return msg(box, "Scegli due conti diversi.");
      if (!amt.abs()) return msg(box, "Inserisci l'importo.");
      const id = crypto.randomUUID();
      const base = { occurred_on: date.value, kind: "transfer", transfer_id: id, source: "manual", merchant: "Giroconto" };
      const { error } = await sb.from("transactions").insert([
        { ...base, account_id: from.value, amount_cents: -amt.abs() },
        { ...base, account_id: to.value, amount_cents: amt.abs() },
      ]);
      if (error) return msg(box, "Giroconto non riuscito: " + error.message);
      amt.reset(); await refreshAll(); msg($("viewAccounts").querySelector(".card"), "");
    } }),
  );
}

function newAccountCard() {
  const name = el("input", { type: "text", placeholder: "es. UniCredit, Revolut, Amex, Trade Republic", autocomplete: "off" });
  const type = typeSelect("bank");
  const bal = moneyInput({ withSign: true });
  const date = el("input", { type: "date", value: iso(new Date()) });
  const pic = imagePicker(null);
  const box = el("div");
  return el("div", { class: "panel" }, box,
    field("Nome", name), field("Tipo", type), field("Immagine della carta (facoltativa, dalla libreria foto)", pic.wrap),
    field("Saldo iniziale (carta di credito con debito: spunta negativo)", bal.wrap), field("Data del saldo iniziale", date),
    el("button", { style: "width:100%", text: "Aggiungi conto", onclick: async () => {
      if (!name.value.trim()) return msg(box, "Inserisci il nome.");
      const { error } = await sb.from("accounts").insert({ name: name.value.trim(), type: type.value, opening_balance_cents: bal.signed(), opening_date: date.value, image_data: pic.value() || null });
      if (error) return msg(box, "Conto non creato: " + error.message);
      state.newAcc = false; await refreshAll();
    } }),
  );
}

/* ---------- CATEGORIE ---------- */
async function deleteAccount(a) {
  if (!confirm(`Eliminare "${a.name}"?`)) return;
  const { error } = await sb.from("accounts").delete().eq("id", a.id);
  if (error) {
    if (!confirm(`"${a.name}" ha dei movimenti e non si può eliminare. Archiviarlo? Sparisce da liste e patrimonio, i movimenti restano.`)) return;
    const r = await sb.from("accounts").update({ archived: true }).eq("id", a.id);
    if (r.error) return alert("Non archiviato: " + r.error.message);
  }
  state.panel = null; await refreshAll();
}
function settingsAccounts() {
  if (state.open.accs === undefined) state.open.accs = true;
  const rows = state.accounts.map((a) => {
    const editing = state.panel && state.panel.id === a.id && state.panel.kind === "edit";
    return el("div", { class: "acc" },
      el("div", { class: "row", style: "justify-content:flex-start" },
        a.image_data ? el("img", { class: "thumb", src: a.image_data, alt: "" }) : null,
        el("div", { style: "flex:1" }, el("strong", { text: a.name }), el("div", { class: "muted", text: TYPE_LABEL[a.type] }))),
      el("div", { class: "actions" },
        el("button", { class: "ghost small", text: editing ? "Chiudi" : "Modifica", onclick: () => { state.panel = editing ? null : { id: a.id, kind: "edit" }; renderSettings(); } }),
        el("button", { class: "danger small", text: "Elimina", onclick: () => deleteAccount(a) })),
      editing ? editPanel(a) : null);
  });
  const addBtn = el("button", { style: "width:100%;margin-top:10px", text: state.newAcc ? "Annulla" : "+ Nuova carta o conto", class: state.newAcc ? "ghost" : "",
    onclick: () => { state.newAcc = !state.newAcc; renderSettings(); } });
  return collapsible("accs", `Conti e carte (${state.accounts.length})`, ...rows, addBtn, state.newAcc ? newAccountCard() : null);
}
function renderSettings() {
  const root = $("viewSettings"); root.textContent = "";
  root.appendChild(el("div", { class: "head" }, el("h2", { text: "Impostazioni", style: "margin:0" }), el("button", { class: "ghost small", text: "Chiudi", onclick: () => setTab("moves") })));
  root.appendChild(settingsAccounts());
  const arch = el("div"); root.appendChild(arch);
  sb.from("accounts").select("id,name,type,image_data").eq("archived", true).then(({ data }) => {
    if (!data || !data.length || state.tab !== "settings") return;
    arch.appendChild(collapsible("arch", `Conti archiviati (${data.length})`, ...data.map((a) => el("div", { class: "tx" },
      a.image_data ? el("img", { class: "thumb", src: a.image_data, alt: "" }) : null,
      el("div", { class: "l t", text: a.name }),
      el("button", { class: "ghost small", text: "Ripristina", onclick: async () => { await sb.from("accounts").update({ archived: false }).eq("id", a.id); await refreshAll(); } }),
    ))));
  });
  appendCats(root);
  const upd = el("div");
  root.appendChild(collapsible("app", "App e account",
    el("p", { class: "muted", text: "Versione " + APP_VERSION + ". Si aggiorna da sola quando c'è rete e funziona anche offline." }), upd,
    el("div", { class: "row" },
      el("button", { class: "ghost", text: "Cerca aggiornamenti", onclick: async () => {
        msg(upd, "Controllo...", "ok");
        try { const r = await navigator.serviceWorker.getRegistration(); if (r) await r.update(); msg(upd, "Controllo fatto: se c'è una nuova versione l'app si ricarica da sola.", "ok"); } catch (e) { msg(upd, "Controllo non riuscito (sei offline?)."); }
      } }),
      el("button", { class: "danger", text: "Esci", onclick: doLogout }),
    ),
  ));
}
function appendCats(root) {
  for (const [kind, title] of [["expense", "Categorie di spesa"], ["income", "Categorie di entrata"]]) {
    const card = el("div");
    for (const c of state.categories.filter((x) => x.kind === kind)) {
      card.appendChild(el("div", { class: "tx" },
        el("div", { class: "l t", text: c.name }),
        el("button", { class: "ghost small", text: "Rinomina", onclick: async () => {
          const n = prompt("Nuovo nome:", c.name);
          if (!n || !n.trim() || n.trim() === c.name) return;
          const { error } = await sb.from("categories").update({ name: n.trim() }).eq("id", c.id);
          if (error) return alert("Non salvato: " + error.message);
          await refreshAll();
        } }),
        el("button", { class: "x", "aria-label": "Archivia", text: "×", onclick: async () => {
          if (!confirm(`Archiviare "${c.name}"? I movimenti già registrati la mantengono.`)) return;
          const { error } = await sb.from("categories").update({ archived: true }).eq("id", c.id);
          if (error) return alert("Non archiviata: " + error.message);
          await refreshAll();
        } }),
      ));
    }
    const input = el("input", { type: "text", placeholder: "Nuova categoria", autocomplete: "off" });
    const box = el("div");
    card.append(box, el("div", { class: "row", style: "margin-top:10px" }, input,
      el("button", { text: "Aggiungi", style: "flex:none", onclick: async () => {
        const n = input.value.trim(); if (!n) return;
        const max = Math.max(0, ...state.categories.filter((x) => x.kind === kind && x.sort_order < 90).map((x) => x.sort_order));
        const { error } = await sb.from("categories").insert({ name: n, kind, sort_order: max + 1 });
        if (error) return msg(box, error.code === "23505" ? "Esiste già una categoria con questo nome." : "Non aggiunta: " + error.message);
        await refreshAll();
      } })));
    root.appendChild(collapsible("cat-" + kind, title, card));
  }
}

/* ---------- AVVIO ---------- */
function hasStoredSession() { return Object.keys(localStorage).some((k) => /^sb-.*-auth-token$/.test(k)); }
async function boot() {
  let session = null;
  try { ({ data: { session } } = await sb.auth.getSession()); } catch (e) {}
  const offlineOk = !session && !navigator.onLine && hasStoredSession() && readJSON("wp_cache", null);
  const inApp = !!session || !!offlineOk;
  show($("login"), !inApp); show($("app"), inApp);
  if (!inApp) return;
  flushOutbox();
  $("date").value = iso(new Date());
  setKind("expense"); renderGeo();
  if (await loadRefs()) { renderSelects(); renderChips(); renderPatrimonioTop(); }
  setTab("moves");
}
boot();

if ("serviceWorker" in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
  navigator.serviceWorker.register("sw.js").then((reg) => {
    reg.update().catch(() => {});
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
  }).catch(() => {});
}
</script>
